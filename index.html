      ['PROMPTPAY_IDENTIFIER_TYPE', 'ประเภท PromptPay', 'select', ['msisdn', 'natId', 'eWalletId', 'billerId']],
      ['PROMPTPAY_IDENTIFIER', 'หมายเลข PromptPay / Biller ID', 'text'],
      ['PROMPTPAY_BILLER_REF1', 'Biller Reference 1', 'text'],
      ['PROMPTPAY_BILLER_REF2', 'Biller Reference 2', 'text'],
      ['THUNDER_MERCHANT_NAME', 'ชื่อร้านค้าบน QR', 'text'],
      ['THUNDER_MATCH_ACCOUNT', 'ตรวจสอบบัญชีผู้รับ', 'checkbox'],
      ['THUNDER_CHECK_DUPLICATE', 'ป้องกันสลิปซ้ำ', 'checkbox'],
      ['REQUIRE_OPEN_SHIFT', 'บังคับเปิดกะก่อนรับชำระ', 'checkbox'],
      ['DEFAULT_DEVICE_NAME', 'ชื่ออุปกรณ์เริ่มต้น', 'text'],
      ['IMG_BB_EXPIRATION_SECONDS', 'อายุรูปภาพ ImgBB (วินาที, 0 = ไม่กำหนด)', 'number'],
      ['RECEIPT_FOOTER', 'ข้อความท้ายใบเสร็จ', 'text'],
      ['SOUND_ENABLED', 'เปิดเสียงแจ้งเตือนเมื่อชำระสำเร็จ', 'checkbox'],
      ['LINE_NOTIFICATION_ENABLED', 'เปิดสถานะการแจ้งเตือน LINE', 'checkbox'],
      ['ALLOW_CASHIER_VIEW_OWN_HISTORY', 'อนุญาต Cashier ดูประวัติของตนเอง', 'checkbox']
    ];

    async function renderSettingsPage() {
      showLoadingPage('กำลังโหลดการตั้งค่า');
      const [result, status] = await Promise.all([api('getSettings'), api('getDatabaseStatus').catch(() => null)]);
      const values = {};
      (result.settings || []).forEach(item => { values[item.key] = item.value; });
      const databaseFlags = status && status.integrations ? status.integrations : {};
      const groups = [
        { title: 'ข้อมูลร้านค้า', keys: ['BUSINESS_NAME', 'BUSINESS_ADDRESS', 'BUSINESS_PHONE', 'BUSINESS_LOGO_URL', 'RECEIPT_FOOTER'] },
        { title: 'การรับชำระผ่าน Thunder', keys: ['THUNDER_QR_TYPE', 'PROMPTPAY_IDENTIFIER_TYPE', 'PROMPTPAY_IDENTIFIER', 'PROMPTPAY_BILLER_REF1', 'PROMPTPAY_BILLER_REF2', 'THUNDER_MERCHANT_NAME', 'QR_EXPIRATION_MINUTES', 'THUNDER_MATCH_ACCOUNT', 'THUNDER_CHECK_DUPLICATE'] },
        { title: 'การทำงานและความปลอดภัย', keys: ['REQUIRE_OPEN_SHIFT', 'ALLOW_CASHIER_VIEW_OWN_HISTORY', 'SOUND_ENABLED'] },
        { title: 'การจัดเก็บรูปภาพ', keys: ['IMG_BB_EXPIRATION_SECONDS'] },
        { title: 'การแจ้งเตือน', keys: ['LINE_NOTIFICATION_ENABLED'] }
      ];
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>ตั้งค่าระบบ</h2><p>ตั้งค่าร้านค้า การสร้าง QR และเงื่อนไขการรับชำระเงิน</p></div>${userCan('settings.manage') ? '<button class="btn btn-primary" id="saveSettingsButton"><i class="fa-solid fa-floppy-disk"></i> บันทึกการตั้งค่า</button>' : ''}</div>
        <div class="card card-pad" style="margin-bottom:16px;"><h3 class="card-title">สถานะการเชื่อมต่อบริการ</h3><div class="grid grid-3" style="margin-top:14px;">${integrationCard('Google Sheets', databaseFlags.spreadsheetConfigured)}${integrationCard('Thunder API', databaseFlags.thunderConfigured)}${integrationCard('ImgBB API', databaseFlags.imgbbConfigured)}</div><p class="field-hint" style="margin-top:12px;">สถานะนี้แสดงว่ามีการตั้งค่า Key ใน Backend เท่านั้น ไม่ใช่ผลทดสอบ API แบบเรียลไทม์</p></div>
        <div class="stack">${groups.map(group => `<section class="card card-pad"><h3 class="card-title">${escapeHtml(group.title)}</h3><div class="form-grid" style="margin-top:14px;">${group.keys.map(key => renderSettingField(key, values[key])).join('')}</div>${group.title === 'การแจ้งเตือน' ? '<p class="field-hint" style="margin-top:12px;">การเปิดตัวเลือกนี้เป็นการบันทึกค่าการตั้งค่าเท่านั้น การส่งข้อความ LINE ยังต้องพัฒนาการเชื่อมต่อเพิ่มเติม</p>' : ''}</section>`).join('')}</div>`;
    }

    function integrationCard(label, configured) {
      return `<div class="card card-pad" style="background:#fbfdfd;"><div class="row-between"><strong>${escapeHtml(label)}</strong>${configured ? '<span class="badge badge-success">ตั้งค่าแล้ว</span>' : '<span class="badge badge-warning">ยังไม่ตั้งค่า</span>'}</div></div>`;
    }

    function renderSettingField(key, value) {
      const meta = SETTING_META.find(item => item[0] === key);
      if (!meta) return '';
      const [, label, type, options] = meta;
      if (type === 'checkbox') {
        const checked = ['true', '1', 'yes'].includes(String(value).toLowerCase());
        return `<div class="field full"><label class="switch"><input type="checkbox" data-setting-key="${key}" ${checked ? 'checked' : ''}><span>${escapeHtml(label)}</span></label></div>`;
      }
      if (type === 'select') {
        return `<div class="field"><label>${escapeHtml(label)}</label><select class="select" data-setting-key="${key}">${options.map(option => `<option value="${escapeHtml(option)}" ${String(value || options[0]) === option ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select></div>`;
      }
      return `<div class="field"><label>${escapeHtml(label)}</label><input class="input" type="${type}" data-setting-key="${key}" value="${escapeHtml(value || '')}" ${type === 'number' ? 'min="0" step="1"' : ''}></div>`;
    }

    async function saveSettings() {
      const settings = $$('[data-setting-key]').map(input => ({
        key: input.dataset.settingKey,
        value: input.type === 'checkbox' ? String(input.checked) : input.value
      }));
      try {
        await api('saveSettings', { settings });
        toast('บันทึกการตั้งค่าเรียบร้อยแล้ว', 'success');
        const bootstrap = await api('getBootstrap');
        state.bootstrap = bootstrap; state.settings = bootstrap.settings || {};
      } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
    }

    /* ======================================================================
       DATABASE / API CONFIGURATION STATUS
       ====================================================================== */

    async function renderDatabasePage() {
      showLoadingPage('กำลังตรวจสอบสถานะระบบ');
      const result = await api('getDatabaseStatus');
      const flags = result.integrations || {};
      const databaseRows = result.database || [];
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>สถานะระบบ</h2><p>ตรวจสอบการตั้งค่าฐานข้อมูลและบริการภายนอก</p></div><button class="btn btn-outline" id="refreshDatabaseButton"><i class="fa-solid fa-rotate"></i> ตรวจสอบอีกครั้ง</button></div>
        <div class="grid grid-3">${integrationCard('Google Sheets', flags.spreadsheetConfigured)}${integrationCard('Thunder API', flags.thunderConfigured)}${integrationCard('ImgBB API', flags.imgbbConfigured)}</div>
        <div class="card" style="margin-top:16px;"><div class="card-pad"><h3 class="card-title">โครงสร้างฐานข้อมูล</h3><p class="card-description">Backend Version: ${escapeHtml(result.backendVersion || '-')}</p></div>${databaseRows.length ? `<div class="table-wrap"><table><thead><tr><th>ชื่อชีต</th><th>สถานะ</th><th>จำนวนแถวข้อมูล</th><th>จำนวนคอลัมน์</th></tr></thead><tbody>${databaseRows.map(row => `<tr><td class="mono">${escapeHtml(valueOf(row, 'sheet', 'Sheet'))}</td><td>${valueOf(row, 'exists', 'Exists') ? statusBadge('ACTIVE') : statusBadge('INACTIVE')}</td><td>${Number(valueOf(row, 'rows', 'Rows') || 0)}</td><td>${Number(valueOf(row, 'columns', 'Columns') || 0)}</td></tr>`).join('')}</tbody></table></div>` : emptyHtml('ไม่มีข้อมูลสถานะฐานข้อมูล')}</div>`;
    }

    /* ======================================================================
       CHANGE OWN ACCESS CODE
       ====================================================================== */

    function showChangeCodeModal() {
      openModal('เปลี่ยนรหัสเข้าใช้งาน', `
        <form id="changeCodeForm" class="stack">
          <div class="field"><label for="oldAccessCode">รหัสปัจจุบัน</label><input id="oldAccessCode" class="input" type="password" autocomplete="current-password" required></div>
          <div class="field"><label for="newAccessCode">รหัสใหม่</label><input id="newAccessCode" class="input" type="password" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label for="confirmAccessCode">ยืนยันรหัสใหม่</label><input id="confirmAccessCode" class="input" type="password" autocomplete="new-password" minlength="8" required></div>
          <p class="field-hint">เมื่อเปลี่ยนรหัสสำเร็จ ระบบจะออกจากระบบเพื่อให้เข้าสู่ระบบด้วยรหัสใหม่</p>
        </form>`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'เปลี่ยนรหัส', className: 'btn-primary', onClick: changeOwnAccessCode }
      ]);
    }

    async function changeOwnAccessCode() {
      const oldAccessCode = $('#oldAccessCode').value;
      const newAccessCode = $('#newAccessCode').value;
      const confirmAccessCode = $('#confirmAccessCode').value;
      if (newAccessCode.length < 8) return toast('รหัสใหม่ต้องมีอย่างน้อย 8 ตัวอักษร', 'warning');
      if (newAccessCode !== confirmAccessCode) return toast('รหัสใหม่และการยืนยันไม่ตรงกัน', 'warning');
      try {
        await api('changeOwnAccessCode', { oldAccessCode, newAccessCode });
        closeModal(); await forceLogout('เปลี่ยนรหัสเรียบร้อยแล้ว กรุณาเข้าสู่ระบบด้วยรหัสใหม่');
      } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
    }

    /* ======================================================================
       MORE MENU AND SHARED INTERACTION HANDLERS
       ====================================================================== */

    function renderMoreMenuPage() {
      state.currentPage = 'more';
      renderNavigation();
      $('#topbarTitle').textContent = 'เมนูเพิ่มเติม';
      $('#topbarSubtitle').textContent = 'เครื่องมือบริหารจัดการระบบ';
      const items = NAV_ITEMS.filter(item => item.group === 'more' && ((!item.permission || userCan(item.permission)) && (!item.role || state.user.role === item.role)));
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>เมนูเพิ่มเติม</h2><p>เลือกฟังก์ชันที่ต้องการใช้งาน</p></div></div>
        <div class="grid grid-3">${items.map(item => `<button class="card more-menu-card" type="button" data-page="${item.id}"><span class="stat-icon teal"><i class="fa-solid ${item.icon}"></i></span><strong>${escapeHtml(item.label)}</strong><span class="muted small">เปิด${escapeHtml(item.label)}</span></button>`).join('')}</div>`;
    }

    async function copyText(value) {
      const text = String(value || '');
      if (!text) return toast('ไม่มีข้อมูลให้คัดลอก', 'warning');
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else {
          const area = document.createElement('textarea');
          area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
          document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
        }
        toast('คัดลอกข้อมูลแล้ว', 'success');
      } catch (error) { toast('ไม่สามารถคัดลอกข้อมูลได้', 'error'); }
    }

    function handleDataAction(element) {
      const action = element.dataset.action;
      const id = element.dataset.id || '';
      switch (action) {
        case 'transaction-detail': showTransactionDetail(id); break;
        case 'edit-staff': showEditStaffModal(id); break;
        case 'reset-staff-code': resetStaffCode(id); break;
        case 'toggle-staff-status': toggleStaffStatus(id, element.dataset.status); break;
        case 'edit-device': showDeviceModal(id); break;
        case 'toggle-device-status': toggleDeviceStatus(id, element.dataset.status); break;
        case 'mark-notification-read': markNotificationRead(id); break;
        case 'review-refund': reviewRefund(id, element.dataset.decision); break;
        case 'reload-page': loadPage(state.currentPage); break;
        default: break;
      }
    }

    function bindStaticEvents() {
      $('#loginForm').addEventListener('submit', handleLogin);
      $('#toggleLoginCode').addEventListener('click', () => {
        const field = $('#accessCode');
        field.type = field.type === 'password' ? 'text' : 'password';
        $('#toggleLoginCode').innerHTML = field.type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
      });
      $('#configureApiButton').addEventListener('click', showApiConfig);
      $('#sidebarLogout').addEventListener('click', logout);
      $('#topLogout').addEventListener('click', logout);
      $('#changeCodeButton').addEventListener('click', showChangeCodeModal);
      $('#notificationsButton').addEventListener('click', () => navigate('notifications'));
      $('#modalClose').addEventListener('click', closeModal);
      $('#modalBackdrop').addEventListener('click', event => { if (event.target === $('#modalBackdrop')) closeModal(); });
      $('#cameraClose').addEventListener('click', stopCamera);
      $('#cameraCancel').addEventListener('click', stopCamera);
      $('#cameraBackdrop').addEventListener('click', event => { if (event.target === $('#cameraBackdrop')) stopCamera(); });
      $('#captureSlipButton').addEventListener('click', captureCameraImage);
      $('#cameraFileInput').addEventListener('change', event => fileToBlob(event.target.files[0]));

      document.addEventListener('click', async event => {
        const pageButton = event.target.closest('[data-page]');
        if (pageButton) {
          const pageId = pageButton.dataset.page;
          if (pageId === 'more') {
            if (state.currentTransaction && state.currentTransaction.status === 'PENDING' && state.currentPage !== 'payment') {
              showConfirm('มีรายการรอชำระเงิน', 'ต้องการเปิดเมนูเพิ่มเติมหรือไม่? รายการ QR ปัจจุบันจะยังคงรอชำระอยู่', renderMoreMenuPage);
            } else if (state.currentTransaction && state.currentTransaction.status === 'PENDING' && state.currentPage === 'payment') {
              showConfirm('มีรายการรอชำระเงิน', 'ต้องการออกจากหน้ารับชำระหรือไม่? รายการ QR ปัจจุบันจะยังคงรอชำระอยู่', renderMoreMenuPage);
            } else renderMoreMenuPage();
          } else navigate(pageId);
          return;
        }
        const copyButton = event.target.closest('[data-copy]');
        if (copyButton) { copyText(copyButton.dataset.copy); return; }
        const modalAction = event.target.closest('[data-modal-action]');
        if (modalAction) {
          const callback = state.modalActions[modalAction.dataset.modalAction];
          if (typeof callback === 'function') await callback();
          return;
        }
        const dataAction = event.target.closest('[data-action]');
        if (dataAction) { handleDataAction(dataAction); return; }
        const amountButton = event.target.closest('[data-amount]');
        if (amountButton) {
          paymentAmountDigits = String(Number(amountButton.dataset.amount));
          updatePaymentAmount();
          return;
        }
        const keyButton = event.target.closest('[data-key]');
        if (keyButton) { handlePaymentKey(keyButton.dataset.key); return; }

        const idActions = {
          openCameraButton: openCamera,
          cancelCurrentPaymentButton: cancelCurrentPayment,
          filterTransactionsButton: filterTransactions,
          refreshTransactionsButton: renderTransactionsPage,
          exportTransactionsButton: exportTransactionsCsv,
          addStaffButton: showCreateStaffModal,
          filterStaffButton: filterStaff,
          refreshReportButton: renderReportsPage,
          applyReportFilter: applyReportFilter,
          exportReportButton: exportReportCsv,
          refreshSettlementButton: renderSettlementPage,
          closeBusinessDayButton: closeBusinessDay,
          refreshShiftsButton: renderShiftsPage,
          openShiftButton: openShift,
          closeShiftButton: closeShift,
          refreshRefundsButton: renderRefundsPage,
          addDeviceButton: () => showDeviceModal(''),
          refreshNotificationsButton: renderNotificationsPage,
          refreshAuditButton: renderAuditPage,
          refreshSystemLogsButton: renderSystemLogsPage,
          refreshApiUsageButton: renderApiUsagePage,
          savePermissionsButton: savePermissions,
          uploadMediaButton: showUploadMediaModal,
          refreshMediaButton: renderMediaPage,
          saveSettingsButton: saveSettings,
          refreshDatabaseButton: renderDatabasePage
        };
        const button = event.target.closest('button[id]');
        if (button && idActions[button.id]) await idActions[button.id]();
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if ($('#cameraBackdrop').classList.contains('show')) stopCamera();
          else if ($('#modalBackdrop').classList.contains('show')) closeModal();
        }
        const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
        if (!isInput && state.currentPage === 'payment' && !state.currentTransaction && /^\d$/.test(event.key)) handlePaymentKey(event.key);
        if (!isInput && state.currentPage === 'payment' && !state.currentTransaction && event.key === 'Backspace') handlePaymentKey('back');
        if (!isInput && state.currentPage === 'payment' && !state.currentTransaction && event.key === 'Enter') createQrPayment();
      });
    }

    function initializeApp() {
      bindStaticEvents();
      if (!getApiUrl()) {
        $('#loginScreen').classList.remove('hidden');
        return;
      }
      restoreSession();
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
  <style>
    /* Additional styles for page-specific UI components. */
    .terminal-screen{background:linear-gradient(145deg,#1c3d4a,#0e2732);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:22px 18px;text-align:center;margin-bottom:14px;}
    .terminal-label{color:#b8cbd1;font-size:11px;}
    .terminal-amount-row{display:flex;align-items:center;justify-content:center;gap:10px;}
    .terminal-amount{font-size:38px;font-weight:700;line-height:1.3;letter-spacing:.02em;margin:8px 0;color:#fff;}
    .amount-delete{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#dbe9ec;border-radius:9px;width:36px;height:34px;}
    .amount-delete:hover{background:rgba(255,255,255,.15);}
    .key.enter{display:flex;align-items:center;justify-content:center;gap:7px;}
    .key.utility{color:#d2e4e7;background:rgba(255,255,255,.04);font-size:14px;}
    .terminal-amount small{font-size:12px;color:#bbd1d5;margin-left:5px;}
    .terminal-hint{font-size:10px;color:#9fb6bd;}
    .qr-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:16px;align-items:start;}
    .qr-card{padding:24px;text-align:center;}
    .qr-amount-label{color:var(--muted);font-size:12px;}
    .qr-amount{font-size:32px;font-weight:700;color:var(--ink);margin:4px 0 18px;}
    .qr-amount small{font-size:13px;color:var(--muted);font-weight:500;}
    .qr-image-wrap{display:flex;justify-content:center;margin:0 auto 14px;}
    .qr-image{width:240px;height:240px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;}
    .qr-image img{width:100%;height:100%;object-fit:contain;}
    .qr-image canvas{max-width:100%;max-height:100%;}
    .qr-expiry{display:flex;justify-content:center;gap:7px;align-items:center;color:var(--warning);font-size:12px;margin:12px 0 6px;}
    .qr-transaction,.qr-scan-hint{font-size:11px;color:var(--muted);margin:6px 0;}
    .qr-security-note{font-size:10px;color:var(--muted);margin-top:14px;}
    .qr-security-note i{color:var(--success);margin-right:4px;}
    .receipt-details{max-width:460px;margin:0 auto;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;}
    .receipt-details>div{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:11px;}
    .receipt-details span{color:var(--muted);}
    .chart-bar-track{height:110px;width:100%;display:flex;align-items:end;justify-content:center;background:#f1f6f5;border-radius:7px 7px 0 0;overflow:hidden;}
    .chart-bar-fill{width:70%;background:linear-gradient(180deg,#36a79a,#0f766e);border-radius:6px 6px 0 0;min-height:2px;}
    .chart-bar-item{flex:1;min-width:0;text-align:center;}
    .chart-bar-value{font-size:9px;color:var(--muted);height:18px;white-space:nowrap;overflow:hidden;}
    .chart-bar-label{font-size:9px;color:var(--muted);margin-top:5px;}
    .media-preview{width:100%;height:170px;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#f5f7f8;}
    .more-menu-card{padding:18px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;color:var(--ink);}
    .more-menu-card:hover{border-color:#a8d0c9;box-shadow:var(--shadow);transform:translateY(-1px);}
    @media(max-width:900px){.qr-layout{grid-template-columns:1fr}.qr-layout .payment-side-card{display:none;}}
    @media(max-width:760px){.qr-card{padding:17px}.qr-image{width:220px;height:220px}.qr-amount{font-size:28px}.receipt-details>div{font-size:10px}}
  </style>
</body>
