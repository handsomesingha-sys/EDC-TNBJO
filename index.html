<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark"><i class="fa-solid fa-credit-card"></i></div>
      <h1 class="login-title">EDC PAYMENT</h1>
      <p class="login-subtitle">ระบบรับชำระเงิน</p>
      <form id="loginForm" class="stack">
        <div class="field"><label for="accessCode">รหัสเข้าใช้งาน</label><div class="row" style="gap:0;position:relative;"><input id="accessCode" class="input" type="password" autocomplete="current-password" placeholder="กรอกรหัสเข้าใช้งาน" required style="padding-right:45px;"><button type="button" id="toggleLoginCode" class="btn-ghost" aria-label="แสดงหรือซ่อนรหัส" style="position:absolute;right:5px;top:3px;height:34px;"><i class="fa-regular fa-eye"></i></button></div></div>
        <button id="loginButton" class="btn btn-primary btn-block" type="submit" style="padding:12px;">เข้าสู่ระบบ</button>
      </form>
      <button class="login-config" id="configureApiButton" type="button"><i class="fa-solid fa-link"></i> ตั้งค่าการเชื่อมต่อระบบ</button>
      <div class="login-footer">EDC PAYMENT SYSTEM</div>
    </div>
  </section>

  <div id="appShell" class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-icon"><i class="fa-solid fa-credit-card"></i></div><div><strong>EDC PAYMENT</strong><span>PAYMENT MANAGEMENT</span></div></div>
      <div class="nav-section">เมนูหลัก</div><nav id="sidebarMainNav" class="nav-list"></nav>
      <div class="nav-section">จัดการระบบ</div><nav id="sidebarMoreNav" class="nav-list"></nav>
      <div class="sidebar-bottom"><div class="sidebar-user"><div class="avatar" id="sidebarAvatar">U</div><div style="min-width:0;flex:1;"><strong id="sidebarUserName">ผู้ใช้งาน</strong><span id="sidebarUserRole">CASHIER</span></div><button class="btn-ghost" id="sidebarLogout" title="ออกจากระบบ" style="color:#b5c5ce;"><i class="fa-solid fa-right-from-bracket"></i></button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div><h1 class="topbar-title" id="topbarTitle">รับชำระเงิน</h1><div class="topbar-subtitle" id="topbarSubtitle">ระบบรับชำระเงินผ่าน QR Code</div></div><div class="topbar-actions"><span class="status-line hidden" id="apiStatusLine"><span class="status-dot"></span><span>เชื่อมต่อแล้ว</span></span><button class="icon-button" id="notificationsButton" title="การแจ้งเตือน"><i class="fa-regular fa-bell"></i><span id="notificationDot" class="notification-dot hidden"></span></button><button class="icon-button" id="changeCodeButton" title="เปลี่ยนรหัสเข้าใช้งาน"><i class="fa-solid fa-key"></i></button><button class="icon-button" id="topLogout" title="ออกจากระบบ"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
      <div id="pageContent" class="content"><div class="loading-block"><span class="loader"></span> กำลังโหลดข้อมูล</div></div>
    </main>
    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true"><div id="modalBox" class="modal"><div class="modal-head"><h3 id="modalTitle">รายละเอียด</h3><button class="modal-close" id="modalClose" type="button"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <div id="cameraBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal"><div class="modal-head"><h3><i class="fa-solid fa-camera"></i> ถ่ายหลักฐานการชำระเงิน</h3><button class="modal-close" id="cameraClose" type="button"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="camera-video-wrap"><video id="cameraVideo" autoplay playsinline muted></video></div><p class="camera-hint" id="cameraHint">จัดสลิปให้อยู่ในกรอบภาพ แล้วกดถ่ายภาพ ระบบจะส่งตรวจสอบทันที</p><div id="cameraFallback" class="hidden" style="padding-top:12px;"><input id="cameraFileInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" class="input"></div></div><div class="modal-foot"><button class="btn btn-outline" id="cameraCancel" type="button">ยกเลิก</button><button class="btn btn-primary" id="captureSlipButton" type="button"><i class="fa-solid fa-camera"></i> ถ่ายและส่งตรวจสอบ</button></div></div></div>
  <div id="printArea" class="print-area"></div>
  <script>
    'use strict';

    /* ======================================================================
       EDC PAYMENT SYSTEM - FRONTEND
       API contract is aligned with Code.gs dispatchAction_().
       ====================================================================== */

    const APP_CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbxMlHUiIBaxa7ZcOQ3-V6otZ6nxS6oOqJJmibIpYpZTRxUVXTPs33R6O7OAluYWesCP/exec',
      APP_NAME: 'EDC PAYMENT SYSTEM',
      DEFAULT_DEVICE_ID: '',
      SESSION_STORAGE_KEY: 'edc_session_v1',
      API_URL_STORAGE_KEY: 'edc_api_url_v1',
      DEVICE_STORAGE_KEY: 'edc_device_id_v1',
      MAX_IMAGE_BYTES: 4 * 1024 * 1024,
      PAGE_SIZE: 100
    };

    const NAV_ITEMS = [
      { id: 'payment', label: 'รับชำระเงิน', icon: 'fa-credit-card', group: 'main', permission: 'payment.create' },
      { id: 'transactions', label: 'ประวัติรายการ', icon: 'fa-receipt', group: 'main', permission: 'transaction.read.own' },
      { id: 'reports', label: 'รายงาน', icon: 'fa-chart-column', group: 'main', permission: 'reports.read' },
      { id: 'staff', label: 'พนักงาน', icon: 'fa-users', group: 'main', permission: 'staff.read' },
      { id: 'settlement', label: 'จัดการยอดเงิน', icon: 'fa-wallet', group: 'more', permission: 'settlement.read' },
      { id: 'shifts', label: 'จัดการกะพนักงาน', icon: 'fa-clock', group: 'more', permission: 'shift.manage' },
      { id: 'refunds', label: 'ยกเลิก / คืนเงิน', icon: 'fa-arrow-rotate-left', group: 'more', permission: 'refund.request' },
      { id: 'devices', label: 'จัดการอุปกรณ์', icon: 'fa-computer', group: 'more', permission: 'device.manage' },
      { id: 'notifications', label: 'การแจ้งเตือน', icon: 'fa-bell', group: 'more', permission: 'notifications.read' },
      { id: 'audit', label: 'บันทึกกิจกรรม', icon: 'fa-clipboard-list', group: 'more', permission: 'audit.read' },
      { id: 'systemlogs', label: 'บันทึกระบบ', icon: 'fa-list-check', group: 'more', permission: 'systemlogs.read' },
      { id: 'apiusage', label: 'การใช้งาน API', icon: 'fa-chart-line', group: 'more', role: 'ADMIN' },
      { id: 'permissions', label: 'จัดการสิทธิ์', icon: 'fa-shield-halved', group: 'more', role: 'ADMIN' },
      { id: 'media', label: 'คลังรูปภาพ', icon: 'fa-images', group: 'more', permission: 'settings.read' },
      { id: 'settings', label: 'ตั้งค่าระบบ', icon: 'fa-gear', group: 'more', permission: 'settings.read' },
      { id: 'database', label: 'สถานะระบบ', icon: 'fa-database', group: 'more', role: 'ADMIN' }
    ];

    const state = {
      token: '', user: null, permissions: [], bootstrap: null, settings: {},
      currentPage: 'payment', currentTransaction: null, transactionTimer: null,
      cameraStream: null, cameraFallback: false, currentSlipImage: '',
      currentTransactionRows: [], currentStaffRows: [], currentShift: null,
      currentRefundRows: [], currentDeviceRows: [], currentMediaRows: [],
      currentNotifications: [], modalActions: {}, reportData: null,
      requestBusy: false, notificationUnread: false
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    function getApiUrl() {
      return (localStorage.getItem(APP_CONFIG.API_URL_STORAGE_KEY) || APP_CONFIG.API_URL || '').trim();
    }

    function getDeviceId() {
      let id = localStorage.getItem(APP_CONFIG.DEVICE_STORAGE_KEY);
      if (!id) {
        id = 'EDC-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10)).toUpperCase();
        localStorage.setItem(APP_CONFIG.DEVICE_STORAGE_KEY, id);
      }
      return id;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(value || 0));
    }

    function formatDate(value, withTime = true) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat('th-TH', withTime
        ? { dateStyle: 'short', timeStyle: 'short' }
        : { dateStyle: 'medium' }).format(date);
    }

    function todayInputValue() {
      const now = new Date();
      return [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
    }

    function monthStartValue() {
      const now = new Date();
      return [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), '01'].join('-');
    }

    function initials(name) {
      const value = String(name || '').trim();
      return value ? value.slice(0, 1).toUpperCase() : 'U';
    }

    function normalizeStatus(status) {
      const value = String(status || '').toUpperCase();
      const map = {
        PAID: ['สำเร็จ', 'success'], PENDING: ['รอชำระ', 'warning'], EXPIRED: ['หมดอายุ', 'muted'],
        CANCELLED: ['ยกเลิก', 'danger'], FAILED: ['ไม่สำเร็จ', 'danger'],
        ACTIVE: ['ใช้งาน', 'success'], INACTIVE: ['ระงับใช้งาน', 'muted'],
        OPEN: ['กำลังเปิดกะ', 'success'], CLOSED: ['ปิดกะแล้ว', 'muted'],
        APPROVED_PENDING_PROVIDER: ['รอดำเนินการคืนเงิน', 'warning'], APPROVED: ['อนุมัติ', 'success'],
        REJECTED: ['ไม่อนุมัติ', 'danger'], SUCCESS: ['สำเร็จ', 'success'], ERROR: ['ผิดพลาด', 'danger'],
        UNREAD: ['ยังไม่อ่าน', 'warning'], READ: ['อ่านแล้ว', 'muted']
      };
      return map[value] || [value || '-', 'muted'];
    }

    function statusBadge(status) {
      const [label, tone] = normalizeStatus(status);
      return `<span class="badge badge-${tone}">${escapeHtml(label)}</span>`;
    }

    function loadingHtml(message = 'กำลังโหลดข้อมูล') {
      return `<div class="loading-block"><span class="loader"></span>${escapeHtml(message)}</div>`;
    }

    function emptyHtml(message = 'ไม่พบข้อมูล') {
      return `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><strong>${escapeHtml(message)}</strong></div>`;
    }

    function userCan(permission) {
      if (!state.user) return false;
      if (state.user.role === 'ADMIN') return true;
      return state.permissions.includes(permission);
    }

    function friendlyError(message, code) {
      const text = String(message || 'ไม่สามารถดำเนินการได้');
      if (/connect|spreadsheet|sheet|database|fetch|network|timeout|server|script|exception/i.test(text)) return 'เชื่อมต่อข้อมูลไม่สำเร็จ';
      if (code === 'SESSION_INVALID' || code === 'SESSION_EXPIRED' || /session/i.test(text)) return 'หมดเวลาเข้าใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง';
      if (code === 'PERMISSION_DENIED') return 'คุณไม่มีสิทธิ์ดำเนินการนี้';
      return text;
    }

    async function api(action, data = {}, options = {}) {
      const apiUrl = getApiUrl();
      if (!apiUrl) throw new Error('กรุณาตั้งค่าการเชื่อมต่อระบบก่อนใช้งาน');
      const request = { action, data };
      if (state.token && action !== 'login') request.token = state.token;
      let response;
      try {
        response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(request),
          redirect: 'follow'
        });
      } catch (error) {
        throw new Error('เชื่อมต่อข้อมูลไม่สำเร็จ');
      }
      let result;
      try { result = await response.json(); }
      catch (error) { throw new Error('ไม่สามารถอ่านผลการตอบกลับได้ กรุณาตรวจสอบการเชื่อมต่อ'); }
      if (!response.ok || !result || result.ok !== true) {
        const code = result && result.code ? result.code : '';
        const message = friendlyError(result && result.message, code);
        if (String(code).indexOf('SESSION_') === 0 || code === 'USER_INACTIVE') forceLogout(message);
        const error = new Error(message);
        error.code = code;
        error.response = result;
        throw error;
      }
      return result.data || {};
    }

    function toast(message, type = 'info', title = '') {
      const stack = $('#toastStack');
      if (!stack) return;
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info';
      const toastNode = document.createElement('div');
      toastNode.className = `toast ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
      toastNode.innerHTML = `<i class="fa-solid ${icon}"></i><div><strong>${escapeHtml(title || (type === 'success' ? 'สำเร็จ' : type === 'error' ? 'ไม่สำเร็จ' : 'แจ้งเตือน'))}</strong><span>${escapeHtml(message)}</span></div>`;
      stack.appendChild(toastNode);
      window.setTimeout(() => toastNode.remove(), 4200);
    }

    function openModal(title, body, buttons = [], options = {}) {
      const backdrop = $('#modalBackdrop');
      $('#modalTitle').textContent = title;
      $('#modalBody').innerHTML = body;
      $('#modalBox').classList.toggle('wide', !!options.wide);
      const foot = $('#modalFoot');
      foot.innerHTML = '';
      state.modalActions = {};
      buttons.forEach((button, index) => {
        const id = `modal-action-${index}`;
        state.modalActions[id] = button.onClick;
        const element = document.createElement('button');
        element.type = 'button';
        element.className = `btn ${button.className || 'btn-outline'}`;
        element.dataset.modalAction = id;
        element.innerHTML = button.icon ? `<i class="fa-solid ${button.icon}"></i>${escapeHtml(button.label)}` : escapeHtml(button.label);
        foot.appendChild(element);
      });
      backdrop.classList.add('show');
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      $('#modalBackdrop').classList.remove('show');
      $('#modalBackdrop').setAttribute('aria-hidden', 'true');
      state.modalActions = {};
    }

    function showConfirm(title, message, onConfirm, danger = false) {
      openModal(title, `<p>${escapeHtml(message)}</p>`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'ยืนยัน', className: danger ? 'btn-danger' : 'btn-primary', onClick: async () => { closeModal(); await onConfirm(); } }
      ]);
    }

    function showApiConfig() {
      const current = getApiUrl();
      openModal('ตั้งค่าการเชื่อมต่อ API', `
        <div class="stack">
          <div class="field"><label for="apiUrlInput">Google Apps Script Web App URL</label><input id="apiUrlInput" class="input" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(current)}"></div>
          <p class="field-hint">วาง URL ที่ได้จากการ Deploy Google Apps Script เป็น Web App และต้องลงท้ายด้วย /exec</p>
        </div>`, [
        { label: 'ทดสอบการเชื่อมต่อ', className: 'btn-outline', onClick: async () => {
          const value = $('#apiUrlInput').value.trim();
          if (!value) return toast('กรุณากรอก URL ก่อน', 'warning');
          try {
            const response = await fetch(value, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'health', data: {} }), redirect: 'follow' });
            const json = await response.json();
            if (json && json.ok) toast('เชื่อมต่อระบบสำเร็จ', 'success'); else toast('เชื่อมต่อข้อมูลไม่สำเร็จ', 'error');
          } catch (error) { toast('เชื่อมต่อข้อมูลไม่สำเร็จ', 'error'); }
        }},
        { label: 'บันทึก URL', className: 'btn-primary', onClick: () => {
          const value = $('#apiUrlInput').value.trim();
          if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(value)) return toast('รูปแบบ URL ไม่ถูกต้อง', 'warning');
          localStorage.setItem(APP_CONFIG.API_URL_STORAGE_KEY, value);
          closeModal(); toast('บันทึกการเชื่อมต่อแล้ว', 'success');
        }}
      ], { wide: false });
    }

    function showLoadingPage(message) {
      $('#pageContent').innerHTML = loadingHtml(message);
    }

    function renderNavigation() {
      const allowed = item => (!item.permission || userCan(item.permission)) && (!item.role || state.user.role === item.role);
      const main = NAV_ITEMS.filter(item => item.group === 'main' && allowed(item));
      const more = NAV_ITEMS.filter(item => item.group === 'more' && allowed(item));
      const createButton = item => `<button class="nav-item ${state.currentPage === item.id ? 'active' : ''}" type="button" data-page="${item.id}"><i class="fa-solid ${item.icon}"></i><span>${item.label}</span></button>`;
      $('#sidebarMainNav').innerHTML = main.map(createButton).join('');
      $('#sidebarMoreNav').innerHTML = more.map(createButton).join('');
      const mobileItems = ['payment', 'transactions', 'reports', 'staff'].map(id => NAV_ITEMS.find(item => item.id === id)).filter(item => item && allowed(item));
      const mobileMarkup = mobileItems.map(item => `<button type="button" data-page="${item.id}" class="${state.currentPage === item.id ? 'active' : ''}"><i class="fa-solid ${item.icon}"></i><span>${item.label}</span></button>`).join('');
      const hasMore = more.length > 0;
      $('#mobileNav').innerHTML = mobileMarkup + (hasMore ? `<button type="button" data-page="more" class="${state.currentPage === 'more' || more.some(item => item.id === state.currentPage) ? 'active' : ''}"><i class="fa-solid fa-bars"></i><span>เพิ่มเติม</span></button>` : '');
    }

    function setActivePage(pageId) {
      state.currentPage = pageId;
      renderNavigation();
      const item = NAV_ITEMS.find(nav => nav.id === pageId);
      $('#topbarTitle').textContent = item ? item.label : (pageId === 'more' ? 'เมนูเพิ่มเติม' : 'EDC PAYMENT');
      $('#topbarSubtitle').textContent = pageId === 'payment' ? 'ระบบรับชำระเงินผ่าน QR Code' : 'ระบบจัดการ EDC Payment';
    }

    async function navigate(pageId) {
      const item = NAV_ITEMS.find(nav => nav.id === pageId);
      if (!item) return;
      if (item.permission && !userCan(item.permission)) return toast('คุณไม่มีสิทธิ์เข้าถึงเมนูนี้', 'error');
      if (item.role && state.user.role !== item.role) return toast('คุณไม่มีสิทธิ์เข้าถึงเมนูนี้', 'error');
      if (state.currentTransaction && state.currentTransaction.status === 'PENDING' && pageId !== 'payment') {
        return showConfirm('มีรายการรอชำระเงิน', 'ต้องการออกจากหน้ารับชำระหรือไม่? รายการ QR ปัจจุบันจะยังคงรอชำระอยู่', async () => { setActivePage(pageId); await loadPage(pageId); });
      }
      setActivePage(pageId);
      await loadPage(pageId);
    }

    async function loadPage(pageId) {
      try {
        switch (pageId) {
          case 'payment': renderPaymentPage(); break;
          case 'transactions': await renderTransactionsPage(); break;
          case 'reports': await renderReportsPage(); break;
          case 'staff': await renderStaffPage(); break;
          case 'settlement': await renderSettlementPage(); break;
          case 'shifts': await renderShiftsPage(); break;
          case 'refunds': await renderRefundsPage(); break;
          case 'devices': await renderDevicesPage(); break;
          case 'notifications': await renderNotificationsPage(); break;
          case 'audit': await renderAuditPage(); break;
          case 'systemlogs': await renderSystemLogsPage(); break;
          case 'apiusage': await renderApiUsagePage(); break;
          case 'permissions': await renderPermissionsPage(); break;
          case 'media': await renderMediaPage(); break;
          case 'settings': await renderSettingsPage(); break;
          case 'database': await renderDatabasePage(); break;
          default: renderPaymentPage();
        }
      } catch (error) {
        $('#pageContent').innerHTML = `<div class="card card-pad">${emptyHtml(friendlyError(error.message, error.code))}<div class="text-center"><button class="btn btn-outline" data-action="reload-page"><i class="fa-solid fa-rotate"></i> ลองอีกครั้ง</button></div></div>`;
      }
    }

    function showApp() {
      $('#loginScreen').classList.add('hidden');
      $('#appShell').style.display = 'block';
      $('#sidebarUserName').textContent = state.user.fullName || 'ผู้ใช้งาน';
      $('#sidebarUserRole').textContent = state.user.role || '';
      $('#sidebarAvatar').textContent = initials(state.user.fullName);
      $('#apiStatusLine').classList.remove('hidden');
      renderNavigation();
    }

    async function afterLogin() {
      const bootstrap = await api('getBootstrap');
      state.bootstrap = bootstrap;
      state.user = bootstrap.user || state.user;
      state.permissions = Array.isArray(bootstrap.permissions) ? bootstrap.permissions : [];
      state.settings = bootstrap.settings || {};
      state.currentShift = bootstrap.openShift || null;
      showApp();
      setActivePage('payment');
      await loadPage('payment');
      refreshNotificationDot();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const input = $('#accessCode');
      const button = $('#loginButton');
      const accessCode = input.value.trim();
      if (!accessCode) return toast('กรุณากรอกรหัสเข้าใช้งาน', 'warning');
      button.disabled = true;
      button.innerHTML = '<span class="loader"></span> กำลังเข้าสู่ระบบ';
      try {
        const result = await api('login', { accessCode, deviceId: getDeviceId() });
        if (!result.token || !result.user) throw new Error('เข้าสู่ระบบไม่สำเร็จ');
        state.token = result.token;
        state.user = result.user;
        sessionStorage.setItem(APP_CONFIG.SESSION_STORAGE_KEY, JSON.stringify({ token: result.token, user: result.user }));
        await afterLogin();
        toast('เข้าสู่ระบบสำเร็จ', 'success');
      } catch (error) {
        state.token = ''; state.user = null;
        sessionStorage.removeItem(APP_CONFIG.SESSION_STORAGE_KEY);
        toast(friendlyError(error.message, error.code), 'error');
      } finally {
        button.disabled = false;
        button.innerHTML = 'เข้าสู่ระบบ';
      }
    }

    async function restoreSession() {
      const savedUrl = localStorage.getItem(APP_CONFIG.API_URL_STORAGE_KEY);
      if (savedUrl) APP_CONFIG.API_URL = savedUrl;
      const saved = sessionStorage.getItem(APP_CONFIG.SESSION_STORAGE_KEY);
      if (!saved) return;
      try {
        const session = JSON.parse(saved);
        state.token = session.token || '';
        state.user = session.user || null;
        if (state.token) await afterLogin();
      } catch (error) {
        state.token = ''; state.user = null;
        sessionStorage.removeItem(APP_CONFIG.SESSION_STORAGE_KEY);
      }
    }

    async function forceLogout(message = '') {
      state.token = ''; state.user = null; state.permissions = [];
      sessionStorage.removeItem(APP_CONFIG.SESSION_STORAGE_KEY);
      stopCamera(); clearTransactionTimer();
      $('#appShell').style.display = 'none';
      $('#loginScreen').classList.remove('hidden');
      if (message) toast(message, 'warning');
    }

    async function logout() {
      try { if (state.token) await api('logout'); } catch (error) { /* local logout still proceeds */ }
      await forceLogout('ออกจากระบบเรียบร้อยแล้ว');
      $('#accessCode').value = '';
    }

    /* ======================================================================
       PAYMENT TERMINAL AND QR FLOW
       ====================================================================== */

    let paymentAmountDigits = '';

    function renderPaymentPage() {
      clearTransactionTimer();
      if (state.currentTransaction && state.currentTransaction.status === 'PENDING') {
        renderPendingPayment(state.currentTransaction);
        startTransactionTimer(state.currentTransaction.qrExpiresAt);
        return;
      }
      state.currentTransaction = null;
      paymentAmountDigits = '';
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>รับชำระเงิน</h2><p>กรอกจำนวนเงินและกด ENTER เพื่อสร้าง QR Code</p></div><div class="heading-actions"><span class="badge badge-success"><i class="fa-solid fa-circle"></i> พร้อมรับชำระ</span></div></div>
        <div class="payment-layout">
          <section class="card terminal-card">
            <div class="terminal-screen">
              <div class="terminal-label">จำนวนเงินที่ต้องชำระ</div>
              <div class="terminal-amount-row"><div class="terminal-amount"><span id="paymentAmount">0.00</span><small>THB</small></div><button class="amount-delete" type="button" data-key="back" title="ลบตัวเลขล่าสุด"><i class="fa-solid fa-delete-left"></i></button></div>
              <div class="terminal-hint">กรอกจำนวนเงินด้วยแป้นตัวเลข</div>
            </div>
            <div class="popular-amounts">
              ${[20,50,100,200,500,1000].map(amount => `<button class="btn btn-outline btn-sm" type="button" data-amount="${amount}">${amount.toLocaleString('en-US')} ฿</button>`).join('')}
            </div>
            <div class="keypad" id="paymentKeypad">
              ${['1','2','3','4','5','6','7','8','9','clear','0','enter'].map(key => key === 'clear'
                ? '<button class="key utility" type="button" data-key="clear"><i class="fa-solid fa-rotate-left"></i><span>ล้าง</span></button>'
                : key === 'enter'
                  ? '<button class="key enter" type="button" data-key="enter"><i class="fa-solid fa-arrow-right-to-bracket"></i><span>ENTER</span></button>'
                  : `<button class="key" type="button" data-key="${key}">${key}</button>`).join('')}
            </div>
            <div class="field" style="margin-top:14px;"><label for="paymentNote">หมายเหตุ (ไม่บังคับ)</label><input id="paymentNote" class="input" maxlength="250" placeholder="ระบุรายละเอียดเพิ่มเติม"></div>
          </section>
          <aside class="stack payment-side-card">
            <div class="card card-pad"><div class="row"><div class="stat-icon teal"><i class="fa-solid fa-shield-halved"></i></div><div><strong>รับชำระอย่างปลอดภัย</strong><div class="muted small">ตรวจสอบสลิปผ่าน Thunder API</div></div></div><div class="divider"></div><div class="status-line"><span class="status-dot"></span> ระบบพร้อมใช้งาน</div><div class="status-line" style="margin-top:10px;"><i class="fa-solid fa-mobile-screen"></i> รหัสเครื่อง ${escapeHtml(getDeviceId())}</div></div>
            <div class="card card-pad"><h3 class="card-title">ขั้นตอนรับชำระ</h3><div class="stack" style="margin-top:14px;gap:11px;"><div class="row"><span class="badge badge-info">01</span><span>กรอกจำนวนเงิน</span></div><div class="row"><span class="badge badge-info">02</span><span>สร้าง QR Code</span></div><div class="row"><span class="badge badge-info">03</span><span>ถ่ายภาพสลิป</span></div><div class="row"><span class="badge badge-success">04</span><span>ตรวจสอบและยืนยัน</span></div></div></div>
          </aside>
        </div>`;
      updatePaymentAmount();
    }

    function updatePaymentAmount() {
      const number = Number(paymentAmountDigits || 0);
      const display = $('#paymentAmount');
      if (display) display.textContent = formatMoney(number);
    }

    function handlePaymentKey(key) {
      if (key === 'enter') return createQrPayment();
      if (key === 'clear') paymentAmountDigits = '';
      else if (key === 'back') paymentAmountDigits = paymentAmountDigits.slice(0, -1);
      else if (/^\d$/.test(key) && paymentAmountDigits.length < 10) {
        paymentAmountDigits = (paymentAmountDigits + key).replace(/^0+(?=\d)/, '');
      }
      updatePaymentAmount();
    }

    async function createQrPayment() {
      const amount = Number(paymentAmountDigits || 0);
      if (!Number.isFinite(amount) || amount <= 0) return toast('กรุณากรอกจำนวนเงินให้ถูกต้อง', 'warning');
      // The ENTER control is rendered with data-key="enter" (not id=createQrButton).
      // Query the real control and guard against rapid repeated submissions.
      const button = $('[data-key="enter"]');
      if (button && button.disabled) return;
      if (button) {
        button.disabled = true;
        button.innerHTML = '<span class="loader"></span> กำลังสร้าง QR Code';
      }
      try {
        const result = await api('createPayment', { amount, note: $('#paymentNote').value.trim(), deviceId: getDeviceId() });
        const raw = result.transaction || {};
        const normalized = {
          transactionId: raw.TransactionID || raw.transactionId || '',
          amount: Number(raw.Amount || raw.amount || amount),
          status: raw.Status || raw.status || 'PENDING',
          cashierName: raw.CashierName || state.user.fullName,
          deviceId: raw.DeviceID || getDeviceId(),
          createdAt: raw.CreatedAt || new Date().toISOString(),
          qrExpiresAt: raw.QRExpiresAt || result.expiresAt,
          qrPayload: raw.QRPayload || (result.qr && result.qr.payload) || '',
          qrMime: (result.qr && result.qr.mime) || raw.QRMime || 'image/png',
          qrImage: result.qr && result.qr.image ? result.qr.image : '',
          note: raw.Note || ''
        };
        if (!normalized.transactionId) throw new Error('ไม่สามารถสร้างรายการชำระเงินได้');
        state.currentTransaction = normalized;
        renderPendingPayment(normalized);
        startTransactionTimer(normalized.qrExpiresAt);
        toast('สร้าง QR Code เรียบร้อยแล้ว', 'success');
      } catch (error) {
        toast(friendlyError(error.message, error.code), 'error');
        if (button && button.isConnected) {
          button.disabled = false;
          button.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> ENTER';
        }
      }
    }

    function normalizeQrSource(image, mime) {
      if (!image) return '';
      const value = String(image).trim();
      if (/^(https?:|data:image\/)/i.test(value)) return value;
      return `data:${mime || 'image/png'};base64,${value}`;
    }

    function renderPendingPayment(transaction) {
      const qrSource = normalizeQrSource(transaction.qrImage, transaction.qrMime);
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>รอชำระเงิน</h2><p>ให้ลูกค้าสแกน QR Code เพื่อชำระเงิน</p></div><span class="badge badge-warning"><i class="fa-regular fa-clock"></i> รอชำระเงิน</span></div>
        <div class="qr-layout">
          <section class="card qr-card">
            <div class="qr-amount-label">ยอดเงินที่ต้องชำระ</div><div class="qr-amount">${formatMoney(transaction.amount)} <small>บาท</small></div>
            <div class="qr-image-wrap"><div id="paymentQrImage" class="qr-image">${qrSource ? `<img src="${escapeHtml(qrSource)}" alt="QR Code สำหรับชำระเงิน">` : '<div id="qrFallback"></div>'}</div></div>
            <div class="qr-expiry"><i class="fa-regular fa-clock"></i> QR Code หมดอายุใน <strong id="qrCountdown">--:--</strong></div>
            <div class="qr-transaction">เลขที่รายการ: <span class="mono">${escapeHtml(transaction.transactionId)}</span></div>
            <div class="qr-scan-hint">เปิดแอปธนาคารและสแกน QR Code เพื่อชำระเงิน</div>
            <button class="btn btn-primary btn-block" id="openCameraButton" type="button"><i class="fa-solid fa-camera"></i> ถ่ายหลักฐานการชำระเงิน</button>
            ${userCan('payment.cancel') ? '<button class="btn btn-outline btn-block" id="cancelCurrentPaymentButton" type="button" style="margin-top:8px;"><i class="fa-solid fa-xmark"></i> ยกเลิกรายการ</button>' : ''}
            <div class="qr-security-note"><i class="fa-solid fa-lock"></i> ระบบจะอนุมัติเมื่อการตรวจสอบสลิปผ่านเท่านั้น</div>
          </section>
          <aside class="stack payment-side-card"><div class="card card-pad"><h3 class="card-title">สถานะรายการ</h3><div class="status-line" style="margin-top:14px;"><span class="status-dot offline"></span> กำลังรอการชำระเงิน</div><div class="divider"></div><div class="row-between"><span class="muted small">ยอดเงิน</span><strong>${formatMoney(transaction.amount)} บาท</strong></div><div class="row-between" style="margin-top:10px;"><span class="muted small">พนักงาน</span><strong>${escapeHtml(transaction.cashierName || '-')}</strong></div><div class="row-between" style="margin-top:10px;"><span class="muted small">อุปกรณ์</span><strong>${escapeHtml(transaction.deviceId || '-')}</strong></div></div><div class="card card-pad"><h3 class="card-title">วิธีตรวจสอบ</h3><p class="muted small">ถ่ายภาพสลิปจากลูกค้า ระบบจะส่งตรวจสอบกับ Thunder โดยอัตโนมัติ หากผลไม่ผ่านสามารถถ่ายใหม่ได้ภายในเวลา QR Code</p></div></aside>
        </div>`;
      if (!qrSource && transaction.qrPayload && window.QRCode) {
        const target = $('#qrFallback');
        if (target) new QRCode(target, { text: transaction.qrPayload, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M });
      }
    }

    function clearTransactionTimer() {
      if (state.transactionTimer) window.clearInterval(state.transactionTimer);
      state.transactionTimer = null;
    }

    function startTransactionTimer(expiry) {
      clearTransactionTimer();
      const end = new Date(expiry).getTime();
      const update = () => {
        const remaining = Math.max(0, end - Date.now());
        const minutes = String(Math.floor(remaining / 60000)).padStart(2, '0');
        const seconds = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
        const label = $('#qrCountdown');
        if (label) label.textContent = `${minutes}:${seconds}`;
        if (remaining <= 0) {
          clearTransactionTimer();
          if (state.currentTransaction) state.currentTransaction.status = 'EXPIRED';
          const button = $('#openCameraButton');
          if (button) button.disabled = true;
          toast('QR Code หมดอายุแล้ว กรุณาสร้างรายการใหม่', 'warning');
        }
      };
      update();
      state.transactionTimer = window.setInterval(update, 1000);
    }

    async function cancelCurrentPayment() {
      if (!state.currentTransaction) return;
      const transactionId = state.currentTransaction.transactionId;
      showConfirm('ยกเลิกรายการ', 'ต้องการยกเลิกรายการรับชำระเงินนี้หรือไม่?', async () => {
        try {
          await api('cancelPayment', { transactionId, reason: 'ผู้ใช้งานยกเลิกรายการ' });
          clearTransactionTimer(); state.currentTransaction = null;
          toast('ยกเลิกรายการเรียบร้อยแล้ว', 'success'); renderPaymentPage();
        } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
      }, true);
    }

    async function openCamera() {
      if (!state.currentTransaction || state.currentTransaction.status !== 'PENDING') return toast('ไม่พบรายการที่รอชำระเงิน', 'warning');
      if (new Date(state.currentTransaction.qrExpiresAt).getTime() <= Date.now()) return toast('QR Code หมดอายุแล้ว กรุณาสร้างรายการใหม่', 'warning');
      $('#cameraBackdrop').classList.add('show');
      $('#cameraBackdrop').setAttribute('aria-hidden', 'false');
      $('#cameraHint').textContent = 'จัดสลิปให้อยู่ในกรอบภาพ แล้วกดถ่ายภาพ ระบบจะส่งตรวจสอบทันที';
      $('#cameraFallback').classList.add('hidden');
      $('#captureSlipButton').disabled = false;
      $('#captureSlipButton').innerHTML = '<i class="fa-solid fa-camera"></i> ถ่ายและส่งตรวจสอบ';
      state.cameraFallback = false;
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('CAMERA_UNAVAILABLE');
        state.cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        const video = $('#cameraVideo');
        video.srcObject = state.cameraStream;
        await video.play();
      } catch (error) {
        state.cameraFallback = true;
        $('#cameraVideo').classList.add('hidden');
        $('#cameraFallback').classList.remove('hidden');
        $('#cameraHint').textContent = 'ไม่สามารถเปิดกล้องได้ กรุณาเลือกถ่ายภาพด้วยกล้องของอุปกรณ์';
        $('#captureSlipButton').classList.add('hidden');
      }
    }

    function stopCamera() {
      if (state.cameraStream) {
        state.cameraStream.getTracks().forEach(track => track.stop());
        state.cameraStream = null;
      }
      const video = $('#cameraVideo');
      if (video) { video.pause(); video.srcObject = null; video.classList.remove('hidden'); }
      $('#cameraBackdrop').classList.remove('show');
      $('#cameraBackdrop').setAttribute('aria-hidden', 'true');
      $('#captureSlipButton').classList.remove('hidden');
      $('#cameraFileInput').value = '';
    }

    function captureCameraImage() {
      const video = $('#cameraVideo');
      if (!video.videoWidth || !video.videoHeight) return toast('กล้องยังไม่พร้อม กรุณาลองอีกครั้ง', 'warning');
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1800 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        if (!blob) return toast('ไม่สามารถถ่ายภาพได้ กรุณาลองใหม่', 'error');
        processSlipBlob(blob);
      }, 'image/jpeg', 0.84);
    }

    function fileToBlob(file) {
      if (!file) return;
      if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) return toast('รองรับเฉพาะภาพ JPG, PNG และ WebP', 'warning');
      if (file.size > APP_CONFIG.MAX_IMAGE_BYTES) return toast('ขนาดภาพต้องไม่เกิน 4 MB', 'warning');
      compressImageFile(file).then(processSlipBlob).catch(() => toast('ไม่สามารถอ่านภาพได้ กรุณาลองใหม่', 'error'));
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const image = new Image();
          image.onerror = reject;
          image.onload = () => {
            const scale = Math.min(1, 1800 / image.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('IMAGE_COMPRESS_FAILED')), 'image/jpeg', 0.82);
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result));
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function processSlipBlob(blob) {
      if (!state.currentTransaction) return toast('ไม่พบรายการรับชำระเงิน', 'error');
      if (blob.size > APP_CONFIG.MAX_IMAGE_BYTES) return toast('ขนาดภาพหลังปรับขนาดต้องไม่เกิน 4 MB', 'warning');
      const transaction = state.currentTransaction;
      if (new Date(transaction.qrExpiresAt).getTime() <= Date.now()) {
        stopCamera();
        transaction.status = 'EXPIRED';
        return toast('QR Code หมดอายุแล้ว กรุณาสร้างรายการใหม่', 'warning');
      }
      const imageData = await blobToDataUrl(blob);
      stopCamera();
      await verifyCapturedSlip(transaction, imageData, blob.type || 'image/jpeg');
    }

    async function verifyCapturedSlip(transaction, imageBase64, mimeType) {
      toast('กำลังตรวจสอบสลิป กรุณารอสักครู่', 'info', 'กำลังตรวจสอบ');
      const page = $('#pageContent');
      const previous = page.innerHTML;
      page.innerHTML = `<div class="card card-pad"><div class="success-screen"><span class="loader" style="width:34px;height:34px;border-width:3px;border-color:#d9e9e5;border-top-color:var(--primary);"></span><h2 style="margin:18px 0 5px;font-size:20px;">กำลังตรวจสอบสลิป</h2><p class="muted">ระบบกำลังตรวจสอบข้อมูลการชำระเงิน กรุณาอย่าปิดหน้านี้</p><div class="badge badge-info">${escapeHtml(transaction.transactionId)}</div></div></div>`;
      try {
        const result = await api('verifySlip', { transactionId: transaction.transactionId, imageBase64, mimeType });
        if (result.verified === true && result.canProceed === true) {
          clearTransactionTimer();
          transaction.status = 'PAID';
          transaction.paidAt = new Date().toISOString();
          transaction.slipCheck = result.slipCheck || null;
          state.currentTransaction = transaction;
          renderPaymentSuccess(transaction);
          if (state.settings.soundEnabled) playSuccessSound();
          toast('ตรวจสอบการชำระเงินสำเร็จ', 'success');
          return;
        }
        const reason = result.reason || 'ไม่สามารถยืนยันการชำระเงินได้';
        if (result.canRetry === true && new Date(transaction.qrExpiresAt).getTime() > Date.now()) {
          state.currentTransaction = transaction;
          renderPendingPayment(transaction);
          startTransactionTimer(transaction.qrExpiresAt);
          openModal('ตรวจสอบสลิปไม่ผ่าน', `<div class="text-center"><div class="stat-icon amber" style="width:58px;height:58px;margin:0 auto 14px;"><i class="fa-solid fa-triangle-exclamation"></i></div><p style="font-weight:700;">ไม่สามารถยืนยันการชำระเงิน</p><p class="muted">${escapeHtml(reason)}</p><p class="field-hint">กรุณาตรวจสอบภาพสลิปและถ่ายใหม่อีกครั้ง</p></div>`, [
            { label: 'ถ่ายสลิปใหม่', className: 'btn-primary', icon: 'fa-camera', onClick: () => { closeModal(); openCamera(); } }
          ]);
        } else {
          transaction.status = 'EXPIRED';
          renderPaymentExpired(transaction);
          toast(reason, 'warning');
        }
      } catch (error) {
        const stillValid = new Date(transaction.qrExpiresAt).getTime() > Date.now();
        if (!stillValid || error.code === 'QR_EXPIRED') {
          transaction.status = 'EXPIRED';
          renderPaymentExpired(transaction);
          return;
        }
        state.currentTransaction = transaction;
        renderPendingPayment(transaction);
        startTransactionTimer(transaction.qrExpiresAt);
        openModal('ยังตรวจสอบไม่สำเร็จ', `<p>${escapeHtml(friendlyError(error.message, error.code))}</p><p class="muted small">รายการยังไม่ถูกยืนยันการชำระเงิน คุณสามารถถ่ายสลิปใหม่ได้หาก QR ยังไม่หมดอายุ</p>`, [
          { label: 'ถ่ายสลิปใหม่', className: 'btn-primary', icon: 'fa-camera', onClick: () => { closeModal(); openCamera(); } },
          { label: 'ปิด', className: 'btn-outline', onClick: closeModal }
        ]);
      }
    }

    function renderPaymentSuccess(transaction) {
      const settings = state.settings || {};
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>ผลการชำระเงิน</h2><p>รายการได้รับการตรวจสอบจากระบบแล้ว</p></div><span class="badge badge-success">ชำระเงินสำเร็จ</span></div>
        <div class="card success-screen"><div class="success-mark"><i class="fa-solid fa-check"></i></div><h2 style="font-size:24px;margin:0 0 5px;color:#166534;">ชำระเงินสำเร็จ</h2><p class="muted">ตรวจสอบสลิปผ่านเรียบร้อยแล้ว</p><div class="qr-amount" style="margin:20px 0;">${formatMoney(transaction.amount)} <small>บาท</small></div><div class="receipt-details"><div><span>เลขที่รายการ</span><strong class="mono">${escapeHtml(transaction.transactionId)}</strong></div><div><span>วันที่ชำระ</span><strong>${formatDate(transaction.paidAt || new Date())}</strong></div><div><span>พนักงาน</span><strong>${escapeHtml(transaction.cashierName || state.user.fullName)}</strong></div><div><span>อุปกรณ์</span><strong>${escapeHtml(transaction.deviceId || getDeviceId())}</strong></div></div><div class="heading-actions" style="justify-content:center;margin-top:22px;"><button class="btn btn-outline" id="printReceiptButton"><i class="fa-solid fa-print"></i> พิมพ์ใบเสร็จ</button><button class="btn btn-primary" id="newPaymentButton"><i class="fa-solid fa-plus"></i> รับชำระรายการใหม่</button></div></div>`;
      $('#printReceiptButton').addEventListener('click', () => printReceipt(transaction));
      $('#newPaymentButton').addEventListener('click', () => { state.currentTransaction = null; renderPaymentPage(); });
    }

    function renderPaymentExpired(transaction) {
      clearTransactionTimer();
      state.currentTransaction = { ...transaction, status: 'EXPIRED' };
      $('#pageContent').innerHTML = `<div class="card success-screen"><div class="stat-icon amber" style="width:68px;height:68px;margin:0 auto 15px;"><i class="fa-solid fa-clock"></i></div><h2>QR Code หมดอายุแล้ว</h2><p class="muted">รายการนี้ยังไม่ได้รับการยืนยันการชำระเงิน กรุณาสร้างรายการใหม่</p><div class="badge badge-muted mono">${escapeHtml(transaction.transactionId)}</div><div style="margin-top:20px;"><button class="btn btn-primary" id="newPaymentButton">สร้างรายการใหม่</button></div></div>`;
      $('#newPaymentButton').addEventListener('click', () => { state.currentTransaction = null; renderPaymentPage(); });
    }

    function playSuccessSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const context = new AudioContextClass();
        [660, 880].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.frequency.value = frequency;
          oscillator.type = 'sine';
          gain.gain.setValueAtTime(0.001, context.currentTime + index * 0.13);
          gain.gain.exponentialRampToValueAtTime(0.13, context.currentTime + index * 0.13 + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + index * 0.13 + 0.18);
          oscillator.connect(gain); gain.connect(context.destination);
          oscillator.start(context.currentTime + index * 0.13);
          oscillator.stop(context.currentTime + index * 0.13 + 0.2);
        });
        window.setTimeout(() => context.close(), 700);
      } catch (error) { /* Audio is optional */ }
    }

    function printReceipt(transaction) {
      const settings = state.settings || {};
      $('#printArea').innerHTML = `
        <div style="max-width:360px;margin:auto;font-family:Arial,sans-serif;">

    function exportTransactionsCsv() {
      const rows = state.currentTransactionRows;
      if (!rows.length) return toast('ไม่มีข้อมูลสำหรับส่งออก', 'warning');
      const columns = ['transactionId', 'createdAt', 'amount', 'cashierName', 'deviceId', 'status', 'paidAt'];
      const labels = ['เลขที่รายการ', 'วันที่สร้าง', 'ยอดเงิน', 'พนักงาน', 'อุปกรณ์', 'สถานะ', 'วันที่ชำระ'];
      downloadCsv('edc-transactions.csv', labels, rows.map(row => columns.map(key => row[key] == null ? '' : row[key])));
    }

    function downloadCsv(fileName, headers, rows) {
      const escapeCell = value => `"${String(value == null ? '' : value).replace(/"/g, '""')}"`;
      const content = '\uFEFF' + [headers, ...rows].map(row => row.map(escapeCell).join(',')).join('\r\n');
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = fileName; link.click();
      URL.revokeObjectURL(url);
    }

        await api('updateStaff', { userId: $('#editStaffId').value, prefix: $('#editStaffPrefix').value, fullName: $('#editStaffName').value.trim(), role: $('#editStaffRole').value });
        closeModal(); toast('บันทึกข้อมูลพนักงานแล้ว', 'success'); await renderStaffPage();
      } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
    }

    function resetStaffCode(userId) {
      const staff = state.currentStaffRows.find(row => row.userId === userId);
      if (!staff) return;
      openModal('สร้างรหัสเข้าใช้งานใหม่', `<div class="field"><label for="resetCodePrefix">ตัวอักษรขึ้นต้นรหัส</label><input id="resetCodePrefix" class="input" maxlength="6" value="${escapeHtml(staff.codePrefix || 'TN')}" pattern="[A-Za-z]{1,6}"></div><p class="field-hint">รหัสเดิมจะใช้เข้าสู่ระบบไม่ได้หลังจากเปลี่ยนรหัส</p>`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'สร้างรหัสใหม่', className: 'btn-primary', onClick: async () => {
          const codePrefix = $('#resetCodePrefix').value.trim().toUpperCase();
          if (!/^[A-Z]{1,6}$/.test(codePrefix)) return toast('ตัวขึ้นต้นรหัสไม่ถูกต้อง', 'warning');

        try { await api('setStaffStatus', { userId, status: nextStatus }); toast('เปลี่ยนสถานะพนักงานแล้ว', 'success'); await renderStaffPage(); }

    function valueOf(record, ...keys) {
      if (!record) return '';
      for (const key of keys) if (record[key] !== undefined && record[key] !== null) return record[key];
      return '';
    }

        <div class="grid grid-2" style="margin-top:16px;">
          <div class="card card-pad"><h3 class="card-title">ปิดยอดประจำวัน</h3><p class="card-description">สร้างรายงานสรุปยอด ณ วันที่เลือก</p><div class="field" style="margin-top:16px;"><label for="closingDate">วันที่ปิดยอด</label><input id="closingDate" class="input" type="date" value="${today}"></div><div class="field" style="margin-top:12px;"><label for="closingNotes">หมายเหตุ</label><textarea id="closingNotes" class="textarea" placeholder="หมายเหตุเพิ่มเติม"></textarea></div><button class="btn btn-primary btn-block" id="closeBusinessDayButton" style="margin-top:14px;"><i class="fa-solid fa-lock"></i> สรุปยอดและปิดวัน</button></div>
          <div class="card card-pad"><h3 class="card-title">สรุปยอดรับชำระ</h3><div class="stack" style="margin-top:16px;gap:12px;"><div class="row-between"><span class="muted">ยอดรับชำระสำเร็จ</span><strong>${formatMoney(summary.successAmount)} บาท</strong></div><div class="row-between"><span class="muted">จำนวนรายการสำเร็จ</span><strong>${Number(summary.successCount || 0).toLocaleString('th-TH')}</strong></div><div class="row-between"><span class="muted">รายการรอตรวจสอบ</span><strong>${Number(summary.pendingCount || 0).toLocaleString('th-TH')}</strong></div><div class="row-between"><span class="muted">รายการหมดอายุ</span><strong>${Number(summary.expiredCount || 0).toLocaleString('th-TH')}</strong></div><div class="divider"></div><div class="field-hint">รายการที่ยังไม่ผ่านการยืนยันจะไม่ถูกนับเป็นยอดรับเงินจริง</div></div></div>
        </div>
        <div class="card" style="margin-top:16px;"><div class="card-pad"><h3 class="card-title">กะพนักงานล่าสุด</h3></div>${renderShiftsTable(shifts.slice(0, 10))}</div>`;

      const businessDate = $('#closingDate').value;

      showConfirm('ยืนยันการปิดยอดประจำวัน', `ต้องการสร้างรายงานปิดยอดวันที่ ${businessDate} หรือไม่?`, async () => {

        } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
      });

      showLoadingPage('กำลังโหลดข้อมูลกะ');
      const result = await api('getMyShift');
      const shift = result.shift || null;
      state.currentShift = shift;
      let shifts = [];
      if (userCan('settlement.read')) {
        try { const list = await api('listShifts', { limit: 100 }); shifts = list.shifts || []; } catch (error) { shifts = []; }
      }
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>จัดการกะพนักงาน</h2><p>เปิดกะ ปิดกะ และตรวจสอบยอดประจำกะ</p></div><div class="heading-actions"><button class="btn btn-outline" id="refreshShiftsButton"><i class="fa-solid fa-rotate"></i> รีเฟรช</button></div></div>
        <div class="grid grid-2">
          <div class="card card-pad"><div class="row-between"><h3 class="card-title">กะปัจจุบันของฉัน</h3>${shift ? statusBadge(valueOf(shift, 'Status', 'status')) : statusBadge('CLOSED')}</div>
            ${shift ? `<div class="stack" style="margin-top:16px;"><div><div class="muted small">รหัสกะ</div><strong class="mono">${escapeHtml(valueOf(shift, 'ShiftID', 'shiftId'))}</strong></div><div><div class="muted small">เริ่มกะเมื่อ</div><strong>${formatDate(valueOf(shift, 'OpenedAt', 'openedAt'))}</strong></div><div><div class="muted small">อุปกรณ์</div><strong>${escapeHtml(valueOf(shift, 'DeviceID', 'deviceId') || getDeviceId())}</strong></div></div><button class="btn btn-danger btn-block" id="closeShiftButton" style="margin-top:18px;"><i class="fa-solid fa-lock"></i> ปิดกะทำงาน</button>` : `<div class="empty-state"><i class="fa-regular fa-clock"></i><strong>ยังไม่มีกะที่เปิดใช้งาน</strong><p class="muted small">เปิดกะก่อนเริ่มรับชำระเงิน หากระบบกำหนดให้ต้องเปิดกะ</p></div><button class="btn btn-primary btn-block" id="openShiftButton"><i class="fa-solid fa-play"></i> เปิดกะทำงาน</button>`}
          </div>
          <div class="card card-pad"><h3 class="card-title">ข้อควรปฏิบัติ</h3><div class="stack" style="margin-top:15px;gap:12px;"><div class="row"><i class="fa-solid fa-check-circle" style="color:var(--success);"></i><span>เปิดกะก่อนเริ่มรับชำระเงิน</span></div><div class="row"><i class="fa-solid fa-check-circle" style="color:var(--success);"></i><span>ใช้บัญชีพนักงานของตนเอง</span></div><div class="row"><i class="fa-solid fa-check-circle" style="color:var(--success);"></i><span>ปิดกะเมื่อสิ้นสุดการทำงาน</span></div><div class="row"><i class="fa-solid fa-check-circle" style="color:var(--success);"></i><span>ตรวจสอบยอดก่อนปิดกะ</span></div></div></div>
        </div>
        ${userCan('settlement.read') ? `<div class="card" style="margin-top:16px;"><div class="card-pad"><h3 class="card-title">ประวัติกะพนักงาน</h3></div>${renderShiftsTable(shifts)}</div>` : ''}`;
    }

    function renderShiftsTable(rows) {
      if (!rows.length) return emptyHtml('ไม่พบข้อมูลกะพนักงาน');
      return `<div class="table-wrap"><table><thead><tr><th>รหัสกะ</th><th>พนักงาน</th><th>อุปกรณ์</th><th>เวลาเปิด</th><th>เวลาปิด</th><th>จำนวนรายการ</th><th>ยอดรับเงิน</th><th>สถานะ</th></tr></thead><tbody>${rows.map(row => `<tr><td class="mono">${escapeHtml(valueOf(row, 'ShiftID', 'shiftId'))}</td><td>${escapeHtml(valueOf(row, 'UserName', 'userName') || '-')}</td><td>${escapeHtml(valueOf(row, 'DeviceID', 'deviceId') || '-')}</td><td>${formatDate(valueOf(row, 'OpenedAt', 'openedAt'))}</td><td>${formatDate(valueOf(row, 'ClosedAt', 'closedAt'))}</td><td>${Number(valueOf(row, 'TransactionCount', 'transactionCount') || 0)}</td><td>${formatMoney(valueOf(row, 'TotalAmount', 'totalAmount'))} ฿</td><td>${statusBadge(valueOf(row, 'Status', 'status'))}</td></tr>`).join('')}</tbody></table></div>`;
    }

    async function openShift() {
      try {
        const result = await api('openShift', { deviceId: getDeviceId(), note: '' });
        state.currentShift = result.shift || null;
        toast('เปิดกะทำงานเรียบร้อยแล้ว', 'success');
        await renderShiftsPage();
      } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
    }

    async function closeShift() {
      showConfirm('ปิดกะทำงาน', 'ต้องการปิดกะปัจจุบันหรือไม่?', async () => {
        try {
          const result = await api('closeShift', { note: '' });
          state.currentShift = null;
          const summary = result.summary || {};
          openModal('ปิดกะเรียบร้อยแล้ว', `<div class="grid grid-2"><div class="card card-pad"><div class="muted small">จำนวนรายการ</div><strong>${Number(summary.transactionCount || 0).toLocaleString('th-TH')}</strong></div><div class="card card-pad"><div class="muted small">รายการสำเร็จ</div><strong>${Number(summary.successCount || 0).toLocaleString('th-TH')}</strong></div><div class="card card-pad"><div class="muted small">ยอดรับเงิน</div><strong>${formatMoney(summary.totalAmount)} บาท</strong></div></div>`, [{ label: 'ตกลง', className: 'btn-primary', onClick: async () => { closeModal(); await renderShiftsPage(); } }]);
        } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
      }, true);
    }

    /* ======================================================================
       REFUND REQUEST AND REVIEW

    async function renderRefundsPage() {
      showLoadingPage('กำลังโหลดคำขอคืนเงิน');
      const result = await api('listRefunds', { limit: 100 });
      state.currentRefundRows = result.refunds || [];
      $('#pageContent').innerHTML = `
        <div class="page-heading"><div><h2>ยกเลิก / คืนเงิน</h2><p>จัดการคำขอคืนเงินและติดตามสถานะการพิจารณา</p></div><button class="btn btn-outline" id="refreshRefundsButton"><i class="fa-solid fa-rotate"></i> รีเฟรช</button></div>
        <div class="card"><div class="card-pad"><h3 class="card-title">รายการคำขอคืนเงิน</h3><p class="card-description">การอนุมัติในระบบนี้เป็นการอนุมัติคำขอ ยังไม่ใช่การคืนเงินจริงจากผู้ให้บริการ</p></div>${renderRefundTable(state.currentRefundRows)}</div>`;
    }

    function renderRefundTable(rows) {
      if (!rows.length) return emptyHtml('ไม่พบคำขอคืนเงิน');
      return `<div class="table-wrap"><table><thead><tr><th>รหัสคำขอ</th><th>เลขที่รายการ</th><th>ยอดเงิน</th><th>เหตุผล</th><th>วันที่ขอ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(row => {
        const id = valueOf(row, 'RefundID', 'refundId');
        const status = valueOf(row, 'Status', 'status');
        const pendingReview = String(status).toUpperCase() === 'REQUESTED' && userCan('refund.review');
        return `<tr><td class="mono">${escapeHtml(id)}</td><td class="mono">${escapeHtml(valueOf(row, 'TransactionID', 'transactionId'))}</td><td>${formatMoney(valueOf(row, 'Amount', 'amount'))} ฿</td><td>${escapeHtml(valueOf(row, 'Reason', 'reason'))}</td><td>${formatDate(valueOf(row, 'RequestedAt', 'requestedAt'))}</td><td>${statusBadge(status)}</td><td>${pendingReview ? `<button class="btn btn-success btn-sm" data-action="review-refund" data-id="${escapeHtml(id)}" data-decision="APPROVE">อนุมัติ</button> <button class="btn btn-danger btn-sm" data-action="review-refund" data-id="${escapeHtml(id)}" data-decision="REJECT">ปฏิเสธ</button>` : '<span class="muted small">-</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    }

    function requestRefundForTransaction(transactionId) {
      openModal('ส่งคำขอคืนเงิน', `<div class="field"><label for="refundReason">เหตุผลในการคืนเงิน</label><textarea id="refundReason" class="textarea" maxlength="500" placeholder="ระบุเหตุผลให้ชัดเจน" required></textarea></div><p class="field-hint">ระบบจะสร้างคำขอเพื่อให้ผู้มีสิทธิ์พิจารณา การคืนเงินจริงต้องดำเนินการผ่านผู้ให้บริการชำระเงินแยกต่างหาก</p>`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'ส่งคำขอ', className: 'btn-danger', onClick: async () => {
          const reason = $('#refundReason').value.trim();
          if (!reason) return toast('กรุณาระบุเหตุผลในการคืนเงิน', 'warning');
          try { await api('requestRefund', { transactionId, reason }); closeModal(); toast('ส่งคำขอคืนเงินแล้ว', 'success'); if (state.currentPage === 'refunds') await renderRefundsPage(); }
          catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
        }}
      ]);
    }

    function reviewRefund(refundId, decision) {
      const label = decision === 'APPROVE' ? 'อนุมัติคำขอ' : 'ปฏิเสธคำขอ';
      openModal(label, `<div class="field"><label for="refundReviewNote">หมายเหตุการพิจารณา</label><textarea id="refundReviewNote" class="textarea" maxlength="500" placeholder="ระบุหมายเหตุ (ไม่บังคับ)"></textarea></div>${decision === 'APPROVE' ? '<p class="field-hint">การอนุมัติจะเปลี่ยนสถานะเป็นรอดำเนินการกับผู้ให้บริการ ไม่ได้คืนเงินจริงโดยอัตโนมัติ</p>' : ''}`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'ยืนยัน', className: decision === 'APPROVE' ? 'btn-success' : 'btn-danger', onClick: async () => {

    function showUploadMediaModal() {
      openModal('อัปโหลดรูปภาพ', `
        <div class="stack"><div class="field"><label for="mediaFileInput">เลือกไฟล์รูปภาพ</label><input id="mediaFileInput" type="file" class="input" accept="image/jpeg,image/png,image/webp"></div>
        <div class="field"><label for="mediaImageType">ประเภทภาพ</label><select id="mediaImageType" class="select"><option value="GENERAL">ทั่วไป</option><option value="BUSINESS_LOGO">โลโก้ร้านค้า</option><option value="DOCUMENT">เอกสารประกอบ</option></select></div>
        <div class="field"><label for="mediaRelatedId">รหัสอ้างอิง (ไม่บังคับ)</label><input id="mediaRelatedId" class="input" placeholder="เช่น รหัสร้านค้าหรือรายการ"></div>
        <div id="mediaPreviewWrap" class="hidden"><img id="mediaPreview" style="max-width:100%;max-height:190px;border-radius:10px;border:1px solid var(--line);" alt="ตัวอย่างรูปภาพ"></div>
        <p class="field-hint">รองรับ JPG, PNG และ WebP ขนาดไม่เกิน 4 MB</p></div>`, [
        { label: 'ยกเลิก', className: 'btn-outline', onClick: closeModal },
        { label: 'อัปโหลด', className: 'btn-primary', icon: 'fa-cloud-arrow-up', onClick: uploadMediaFile }
      ]);
      $('#mediaFileInput').addEventListener('change', event => {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > APP_CONFIG.MAX_IMAGE_BYTES) return toast('ขนาดรูปภาพต้องไม่เกิน 4 MB', 'warning');
        const reader = new FileReader();
        reader.onload = () => { $('#mediaPreview').src = reader.result; $('#mediaPreviewWrap').classList.remove('hidden'); };
        reader.readAsDataURL(file);
      });
    }

    async function uploadMediaFile() {
      const file = $('#mediaFileInput').files[0];
      if (!file) return toast('กรุณาเลือกภาพก่อนอัปโหลด', 'warning');
      if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) return toast('รองรับเฉพาะ JPG, PNG และ WebP', 'warning');
      if (file.size > APP_CONFIG.MAX_IMAGE_BYTES) return toast('ขนาดรูปภาพต้องไม่เกิน 4 MB', 'warning');
      try {
        const dataUrl = await blobToDataUrl(file);
        await api('uploadImage', {
          imageBase64: dataUrl,
          mimeType: file.type,
          imageType: $('#mediaImageType').value,
          relatedId: $('#mediaRelatedId').value.trim(),
          fileName: file.name
        });
        closeModal(); toast('อัปโหลดรูปภาพเรียบร้อยแล้ว', 'success'); await renderMediaPage();
      } catch (error) { toast(friendlyError(error.message, error.code), 'error'); }
    }
